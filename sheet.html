<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Наш лист</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital@0;1&family=Manrope:wght@500&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.3/dist/mqtt.min.js"></script><style>body{margin:0;font-family:Manrope,sans-serif;background:#f4e7e1;color:#2a211f}.app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;padding:12px;gap:10px}header{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.brand{font-family:"Cormorant Garamond",serif;font-size:30px}.brand i{color:#c45b6a}.pill{display:flex;gap:8px;align-items:center;background:#fffdfb;border-radius:999px;padding:6px 10px}input{border:0;background:transparent;outline:none;font:inherit}button{font:inherit;cursor:pointer}.ghost{border:0;background:transparent;color:#9c3d4d;font-weight:600}.status{font-size:12px;color:#8a6d68}.status.on{color:#2f7d57}.stage{position:relative;background:#fffdfb;border-radius:22px;box-shadow:0 18px 50px rgba(90,48,48,.12);overflow:hidden}canvas{width:100%;height:100%;touch-action:none}#textin{position:absolute;display:none;border:0;border-bottom:1.5px solid #c45b6a;font:28px "Cormorant Garamond",serif;background:#fffdfbcc}.dock{display:flex;gap:8px;overflow:auto}.group{display:flex;gap:6px;background:#fffdfb;border-radius:16px;padding:6px}.tool,.act{width:40px;height:40px;border:0;border-radius:12px;background:transparent}.tool.active{box-shadow:inset 0 0 0 1.5px #c45b6a;background:#fff}.swatch{width:26px;height:26px;border:0;border-radius:50%}.swatch.active{outline:2px solid #2a211f;outline-offset:2px}.size{border:0;background:transparent;border-radius:12px;padding:8px 10px}.size.active{box-shadow:inset 0 0 0 1.5px #c45b6a}.pop{display:none;position:fixed;left:12px;right:12px;bottom:84px;background:#fff;border-radius:18px;padding:10px;grid-template-columns:repeat(5,1fr)}.pop.open{display:grid}.pop button{border:0;background:transparent;font-size:24px;height:42px}.hint{position:absolute;left:20px;bottom:16px;color:#2a211f59;font-family:"Cormorant Garamond",serif;font-style:italic;font-size:22px;pointer-events:none}.modal{position:fixed;inset:0;background:#3a242447;display:grid;place-items:center;padding:18px}.card{background:#fffdfb;border-radius:24px;padding:26px;width:min(440px,100%)}.card h1{font-family:"Cormorant Garamond",serif;font-size:38px;margin:0 0 8px;font-weight:500}.card p{color:#6d5854}.card input{width:100%;border:1px solid #2a211f14;border-radius:12px;padding:12px;margin:6px 0 12px}.card button{width:100%;border:0;border-radius:12px;padding:12px;background:#c45b6a;color:#fff;font-weight:600}</style></head><body><div class="app"><header><div class="brand">наш <i>лист</i></div><div class="pill"><input id="room" placeholder="секретное слово"><button class="ghost" id="copy">ссылка</button><span class="status" id="status">соединяюсь</span></div><div class="pill"><input id="name" placeholder="твоё имя"></div></header><div class="stage"><canvas id="paper"></canvas><input id="textin" placeholder="записка"><div class="hint" id="hint">чистый лист для вас двоих</div></div><div class="dock"><div class="group" id="tools"></div><div class="group" id="colors"></div><div class="group" id="sizes"></div><div class="group"><button class="act" id="emojiBtn">☺</button><button class="act" id="undo">↩</button><button class="act" id="clear">✕</button><button class="act" id="save">↓</button></div></div></div><div class="pop" id="emojiPop"></div><div class="modal" id="modal"><div class="card"><h1>один лист на двоих</h1><p>Придумайте секретное слово и отправьте его второй половинке. Она открывает эту же страницу и вписывает то же слово.</p><input id="gateRoom" placeholder="секретное слово"><input id="gateName" placeholder="твоё имя"><button id="enter">открыть лист</button></div></div><script>
const TOOLS=[["brush","✎"],["eraser","⌫"],["heart","♡"],["circle","○"],["rect","□"],["line","╱"],["arrow","→"],["star","✧"],["text","А"]];
const COLORS=["#2a211f","#c45b6a","#e38b96","#d7a15e","#7d5ea8","#3f7d6b","#8a6d68","#d4537e"];
const SIZES=[[3,"тонко"],[7,"обычно"],[14,"широко"],[26,"крупно"]];
const EMOJIS=["❤️","😍","🥰","😘","💕","💌","🌹","✨","🌙","💋","🫶","💍","🍓","🎀","⭐"];
const canvas=document.getElementById("paper"),ctx=canvas.getContext("2d"),textin=document.getElementById("textin"),hint=document.getElementById("hint"),statusEl=document.getElementById("status"),roomInput=document.getElementById("room"),nameInput=document.getElementById("name");
const me=localStorage.getItem("nash-me")||("ya-"+Math.random().toString(36).slice(2,8));localStorage.setItem("nash-me",me);
let tool="brush",color=COLORS[1],size=7,strokes=[],clearTs=0,drawing=null,client=null,room="",timer=0;
const hash=w=>{let h=2166136261,s="nash-list:"+w.trim().toLowerCase();for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return (h>>>0).toString(16)};
const uid=()=>me+"-"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const setStatus=(t,on)=>{statusEl.textContent=t;statusEl.classList.toggle("on",!!on)};
const norm=(x,y)=>{const r=canvas.getBoundingClientRect();return [+(x/r.width).toFixed(4),+(y/r.height).toFixed(4)]};
const den=(p)=>{const r=canvas.getBoundingClientRect();return [p[0]*r.width,p[1]*r.height]};
const vis=()=>strokes.filter(s=>s.ts>=clearTs);
function heart(x,y,w,h){ctx.beginPath();ctx.moveTo(x+w/2,y+h*.32);ctx.bezierCurveTo(x+w/2,y+.05*h,x,y,x,y+h*.32);ctx.bezierCurveTo(x,y+h*.58,x+w/2,y+h*.78,x+w/2,y+h);ctx.bezierCurveTo(x+w/2,y+h*.78,x+w,y+h*.58,x+w,y+h*.32);ctx.bezierCurveTo(x+w,y,x+w/2,y+.05*h,x+w/2,y+h*.32);ctx.fill()}
function star(cx,cy,r){ctx.beginPath();for(let i=0;i<10;i++){const rad=i%2?r*.42:r,a=-Math.PI/2+i*Math.PI/5,x=cx+Math.cos(a)*rad,y=cy+Math.sin(a)*rad;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath();ctx.fill()}
function paint(s){const pts=s.points.map(den);ctx.save();ctx.lineCap=ctx.lineJoin="round";ctx.strokeStyle=ctx.fillStyle=s.color;ctx.lineWidth=s.size;if(s.tool==="brush"||s.tool==="eraser"){ctx.beginPath();if(pts.length<2){ctx.arc(pts[0][0],pts[0][1],s.size/2,0,7);ctx.fill()}else{ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length-1;i++)ctx.quadraticCurveTo(pts[i][0],pts[i][1],(pts[i][0]+pts[i+1][0])/2,(pts[i][1]+pts[i+1][1])/2);ctx.lineTo(pts.at(-1)[0],pts.at(-1)[1]);ctx.stroke()}}else if(s.tool==="emoji"){ctx.font=s.size*3+"px serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(s.emoji,pts[0][0],pts[0][1])}else if(s.tool==="text"){ctx.font=Math.max(18,s.size*2.4)+"px Cormorant Garamond,serif";ctx.textBaseline="top";ctx.fillText(s.text||"",pts[0][0],pts[0][1])}else if(pts.length>1){const [x1,y1]=pts[0],[x2,y2]=pts.at(-1),x=Math.min(x1,x2),y=Math.min(y1,y2),w=Math.abs(x2-x1),h=Math.abs(y2-y1);if(s.tool==="heart")heart(x,y,Math.max(w,8),Math.max(h,8));if(s.tool==="circle"){ctx.beginPath();ctx.ellipse(x+w/2,y+h/2,Math.max(w/2,2),Math.max(h/2,2),0,0,7);ctx.fill()}if(s.tool==="rect")ctx.fillRect(x,y,Math.max(w,2),Math.max(h,2));if(s.tool==="star")star(x+w/2,y+h/2,Math.max(w,h)/2);if(s.tool==="line"||s.tool==="arrow"){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();if(s.tool==="arrow"){const a=Math.atan2(y2-y1,x2-x1);ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-14*Math.cos(a-.45),y2-14*Math.sin(a-.45));ctx.lineTo(x2-14*Math.cos(a+.45),y2-14*Math.sin(a+.45));ctx.closePath();ctx.fill()}}}ctx.restore()}
function draw(){const r=canvas.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);ctx.fillStyle="#fffdfb";ctx.fillRect(0,0,r.width,r.height);vis().forEach(s=>{if(s.tool!=="eraser")paint(s)});if(drawing&&drawing.tool!=="eraser")paint(drawing);hint.style.display=vis().length?"none":"block"}
function resize(){const r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);canvas.width=Math.max(1,r.width*d|0);canvas.height=Math.max(1,r.height*d|0);ctx.setTransform(d,0,0,d,0,0);draw()}
function save(){if(room)localStorage.setItem("nash-sheet:"+room,JSON.stringify({clearTs,strokes}))}
function load(){try{const d=JSON.parse(localStorage.getItem("nash-sheet:"+room)||"{}");strokes=d.strokes||[];clearTs=d.clearTs||0}catch(e){strokes=[];clearTs=0}}
function publish(){if(!client||!client.connected||!room)return;client.publish("nashlist/"+hash(room),JSON.stringify({clearTs,strokes:vis(),from:me}),{qos:1,retain:true});setStatus("общий",true)}
function schedule(){clearTimeout(timer);timer=setTimeout(publish,280)}
function merge(data){if((data.clearTs||0)>clearTs){clearTs=data.clearTs;strokes=strokes.filter(s=>s.ts>=clearTs)}const have=new Set(strokes.map(s=>s.id));let n=0;(data.strokes||[]).forEach(s=>{if(s&&s.id&&!have.has(s.id)&&s.ts>=clearTs){strokes.push(s);n++}});if(n){save();draw();setStatus("есть новое",true)}if(vis().some(s=>!(data.strokes||[]).some(r=>r.id===s.id)))schedule()}
function connect(){if(!window.mqtt){setStatus("только здесь");return}if(client)try{client.end(true)}catch(e){}setStatus("соединяюсь");client=mqtt.connect("wss://broker.emqx.io:8084/mqtt",{clientId:"nash-"+me,clean:true,reconnectPeriod:2500,protocolVersion:4});client.on("connect",()=>{setStatus("лист общий",true);client.subscribe("nashlist/"+hash(room),{qos:1},publish)});client.on("message",(_,b)=>{try{merge(JSON.parse(b.toString()))}catch(e){}});client.on("offline",()=>setStatus("нет сети"))}
function openRoom(word,who){room=(word||"").trim()||"луна";roomInput.value=room;if(who)nameInput.value=who;localStorage.setItem("nash-room",room);const u=new URL(location.href);u.searchParams.set("room",room);history.replaceState(null,"",u);load();draw();connect();document.getElementById("modal").style.display="none"}
const pos=e=>{const r=canvas.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]};
canvas.onpointerdown=e=>{if(!room)return;canvas.setPointerCapture(e.pointerId);const [x,y]=pos(e);if(tool==="text"){textin.style.display="block";textin.style.left=x+"px";textin.style.top=y+"px";const n=norm(x,y);textin.dataset.nx=n[0];textin.dataset.ny=n[1];textin.value="";textin.focus();return}if(tool==="emoji")return;drawing={id:uid(),author:nameInput.value||"ты",color,size,tool,ts:Date.now(),points:[norm(x,y)]}};
canvas.onpointermove=e=>{if(!drawing)return;const [x,y]=pos(e),p=norm(x,y),last=drawing.points.at(-1);if(Math.hypot(p[0]-last[0],p[1]-last[1])<.002)return;drawing.points.push(p);draw()};
function finish(){if(!drawing)return;const s=drawing;drawing=null;if(s.tool==="eraser"){const r=canvas.getBoundingClientRect(),rad=size+8;strokes=strokes.filter(st=>st.ts<clearTs||!st.points.some(p=>s.points.some(q=>{const dx=(p[0]-q[0])*r.width,dy=(p[1]-q[1])*r.height;return dx*dx+dy*dy<rad*rad})))}else strokes.push(s);save();schedule();draw()} 
canvas.onpointerup=finish;canvas.onpointercancel=finish;
textin.onkeydown=e=>{if(e.key==="Enter")textin.blur()};
textin.onblur=()=>{const v=textin.value.trim();textin.style.display="none";if(!v)return;strokes.push({id:uid(),author:nameInput.value||"ты",color,size,tool:"text",ts:Date.now(),text:v,points:[[+textin.dataset.nx,+textin.dataset.ny]]});save();schedule();draw()};
function mark(){document.querySelectorAll(".tool").forEach(b=>b.classList.toggle("active",b.dataset.tool===tool))}
document.getElementById("tools").innerHTML=TOOLS.map(t=>`<button class="tool${t[0]===tool?" active":""}" data-tool="${t[0]}">${t[1]}</button>`).join("");
document.getElementById("tools").onclick=e=>{const b=e.target.closest(".tool");if(!b)return;tool=b.dataset.tool;mark()};
document.getElementById("colors").innerHTML=COLORS.map((c,i)=>`<button class="swatch${i===1?" active":""}" data-color="${c}" style="background:${c}"></button>`).join("");
document.getElementById("colors").onclick=e=>{const b=e.target.closest(".swatch");if(!b)return;color=b.dataset.color;document.querySelectorAll(".swatch").forEach(s=>s.classList.toggle("active",s===b))};
document.getElementById("sizes").innerHTML=SIZES.map(s=>`<button class="size${s[0]===7?" active":""}" data-size="${s[0]}">${s[1]}</button>`).join("");
document.getElementById("sizes").onclick=e=>{const b=e.target.closest(".size");if(!b)return;size=+b.dataset.size;document.querySelectorAll(".size").forEach(s=>s.classList.toggle("active",s===b))};
document.getElementById("emojiPop").innerHTML=EMOJIS.map(em=>`<button data-em="${em}">${em}</button>`).join("");
document.getElementById("emojiBtn").onclick=()=>document.getElementById("emojiPop").classList.toggle("open");
document.getElementById("emojiPop").onclick=e=>{const b=e.target.closest("button");if(!b)return;document.getElementById("emojiPop").classList.remove("open");canvas.onclick=ev=>{const [x,y]=pos(ev);strokes.push({id:uid(),author:nameInput.value||"ты",color,size,tool:"emoji",ts:Date.now(),emoji:b.dataset.em,points:[norm(x,y)]});canvas.onclick=null;save();schedule();draw()}};
document.getElementById("undo").onclick=()=>{for(let i=strokes.length-1;i>=0;i--)if(strokes[i].id.startsWith(me)){strokes.splice(i,1);break}save();schedule();draw()};
document.getElementById("clear").onclick=()=>{if(confirm("Очистить лист для вас обоих?")){clearTs=Date.now();strokes=[];save();publish();draw()}};
document.getElementById("save").onclick=()=>{const o=document.createElement("canvas");o.width=canvas.width;o.height=canvas.height;const g=o.getContext("2d");g.fillStyle="#fffdfb";g.fillRect(0,0,o.width,o.height);g.drawImage(canvas,0,0);const a=document.createElement("a");a.href=o.toDataURL("image/png");a.download="nash-list.png";a.click()};
document.getElementById("copy").onclick=async()=>{const u=new URL(location.href);u.searchParams.set("room",roomInput.value.trim()||room);try{await navigator.clipboard.writeText(u);setStatus("ссылка скопирована",true)}catch(e){prompt("Ссылка",u)}};
document.getElementById("enter").onclick=()=>openRoom(document.getElementById("gateRoom").value,document.getElementById("gateName").value);
const preset=new URLSearchParams(location.search).get("room")||localStorage.getItem("nash-room")||"";document.getElementById("gateRoom").value=preset;if(preset)openRoom(preset,localStorage.getItem("nash-name")||"");
addEventListener("resize",resize);resize();
</script></body></html>
